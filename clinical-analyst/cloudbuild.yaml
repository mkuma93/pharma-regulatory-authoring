# Cloud Build — Clinical Analyst Service
#
# Build context: repo root (so Dockerfile can COPY clinical-analyst/)
# Deploy command:
#   gcloud builds submit . --config=clinical-analyst/cloudbuild.yaml

substitutions:
  _PROJECT_ID:   pharma-reguatory-author
  _REGION:       us-central1
  _SERVICE_NAME: clinical-analyst
  _AR_REPO:      ich4
  _TAG:          latest
  _GCS_BUCKET:   pharma-reguatory-author-life-science
  _LLM_MODEL:    gpt-4o-mini

steps:
  # 1. Ensure Artifact Registry repo exists
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe $_AR_REPO \
          --location=$_REGION --project=$_PROJECT_ID &>/dev/null \
        || gcloud artifacts repositories create $_AR_REPO \
          --repository-format=docker \
          --location=$_REGION \
          --project=$_PROJECT_ID \
          --description="ICH4 Docker images"

  # 2. Docker auth
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - "gcloud auth configure-docker $_REGION-docker.pkg.dev --quiet"

  # 3. Build
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - clinical-analyst/Dockerfile
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest"
      - .

  # 4. Push
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME"

  # 5. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--ingress=all"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--port=8084"
      - "--timeout=300"
      - "--set-env-vars=GCP_PROJECT_ID=$_PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,LLM_MODEL=$_LLM_MODEL"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest"

images:
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY

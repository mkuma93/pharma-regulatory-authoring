# Cloud Build — CTD extraction worker
#
# Build context: repo root (submitted by tasks.sh deploy-worker)
# Dockerfile:    ctd_structure/deploy/worker.Dockerfile
#
# Steps:
#   1. Build + push worker image
#   2. Deploy Cloud Run service (no-allow-unauthenticated — Pub/Sub uses OIDC)
#   3. Grant Pub/Sub SA run.invoker so push subscription can authenticate
#   4. Create/update Pub/Sub topic + push subscription

substitutions:
  _PROJECT_ID:    pharma-reguatory-author
  _REGION:        us-central1
  _WORKER_NAME:   ctd-worker
  _AR_REPO:       ich4
  _TAG:           latest
  _ICH_INDEX_URL: "https://ich4-index-74ugcbbbya-uc.a.run.app"
  _GCS_BUCKET:    pharma-reguatory-author-life-science
  _PUBSUB_TOPIC:  ctd-extraction

steps:
  # 1. Ensure Artifact Registry repo exists
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe $_AR_REPO \
          --location=$_REGION --project=$_PROJECT_ID &>/dev/null \
        || gcloud artifacts repositories create $_AR_REPO \
          --repository-format=docker \
          --location=$_REGION \
          --project=$_PROJECT_ID \
          --description="ICH4 Docker images"

  # 2. Authenticate Docker
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - "gcloud auth configure-docker $_REGION-docker.pkg.dev --quiet"

  # 3. Build worker image
  - name: "gcr.io/cloud-builders/docker"
    dir: ctd_structure
    args:
      - build
      - -f
      - deploy/worker.Dockerfile
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_WORKER_NAME:$_TAG"
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_WORKER_NAME:latest"
      - .

  # 4. Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_WORKER_NAME"

  # 5. Deploy worker to Cloud Run (authenticated — Pub/Sub will use OIDC)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_WORKER_NAME"
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_WORKER_NAME:$_TAG"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--port=8080"
      - "--timeout=900"
      - "--cpu-boost"
      - "--set-env-vars=GCP_PROJECT_ID=$_PROJECT_ID,ICH_INDEX_URL=$_ICH_INDEX_URL,GCS_BUCKET=$_GCS_BUCKET"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest"

  # 6. Grant Pub/Sub SA permission to invoke the worker
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        PROJECT_NUMBER=$(gcloud projects describe $_PROJECT_ID --format='value(projectNumber)')
        PUBSUB_SA="service-$${PROJECT_NUMBER}@gcp-sa-pubsub.iam.gserviceaccount.com"
        gcloud run services add-iam-policy-binding $_WORKER_NAME \
          --region=$_REGION \
          --project=$_PROJECT_ID \
          --member="serviceAccount:$${PUBSUB_SA}" \
          --role="roles/run.invoker" \
          --quiet 2>/dev/null || true

  # 7. Create Pub/Sub topic (idempotent) + create/update push subscription
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        # Enable Pub/Sub API
        gcloud services enable pubsub.googleapis.com --project=$_PROJECT_ID --quiet

        # Create topic if missing
        gcloud pubsub topics describe $_PUBSUB_TOPIC --project=$_PROJECT_ID &>/dev/null \
          || gcloud pubsub topics create $_PUBSUB_TOPIC --project=$_PROJECT_ID

        # Get worker URL
        WORKER_URL=$(gcloud run services describe $_WORKER_NAME \
          --region=$_REGION --project=$_PROJECT_ID \
          --format='value(status.url)')
        PUSH_ENDPOINT="$${WORKER_URL}/extract"
        echo "Push endpoint: $${PUSH_ENDPOINT}"

        # Use the dedicated push invoker SA (created by infra/setup.sh)
        # Falls back to Pub/Sub service agent if the dedicated SA doesn't exist yet
        INVOKER_SA="ctd-pubsub-invoker@$_PROJECT_ID.iam.gserviceaccount.com"
        if ! gcloud iam service-accounts describe "$${INVOKER_SA}" \
             --project=$_PROJECT_ID &>/dev/null; then
          echo "Dedicated invoker SA not found — creating it now..."
          gcloud iam service-accounts create ctd-pubsub-invoker \
            --display-name="CTD Pub/Sub Push Invoker" \
            --project=$_PROJECT_ID
        fi
        # Ensure it has run.invoker on the worker
        gcloud run services add-iam-policy-binding $_WORKER_NAME \
          --region=$_REGION \
          --member="serviceAccount:$${INVOKER_SA}" \
          --role="roles/run.invoker" \
          --project=$_PROJECT_ID \
          --quiet 2>/dev/null || true

        SUB_NAME="$_PUBSUB_TOPIC-push"
        # Cloud Run requires audience = base service URL (no path)
        WORKER_BASE_URL=$(echo "$${WORKER_URL}" | cut -d/ -f1-3)

        # Update if exists, create if not
        if gcloud pubsub subscriptions describe "$${SUB_NAME}" --project=$_PROJECT_ID &>/dev/null; then
          gcloud pubsub subscriptions modify-push-config "$${SUB_NAME}" \
            --push-endpoint="$${PUSH_ENDPOINT}" \
            --push-auth-service-account="$${INVOKER_SA}" \
            --push-auth-token-audience="$${WORKER_BASE_URL}" \
            --project=$_PROJECT_ID
          echo "Updated push subscription: $${SUB_NAME}"
        else
          gcloud pubsub subscriptions create "$${SUB_NAME}" \
            --topic=$_PUBSUB_TOPIC \
            --push-endpoint="$${PUSH_ENDPOINT}" \
            --push-auth-service-account="$${INVOKER_SA}" \
            --push-auth-token-audience="$${WORKER_BASE_URL}" \
            --ack-deadline=600 \
            --min-retry-delay=60s \
            --max-retry-delay=600s \
            --project=$_PROJECT_ID
          echo "Created push subscription: $${SUB_NAME}"
        fi

images:
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_WORKER_NAME:$_TAG"
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_WORKER_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY

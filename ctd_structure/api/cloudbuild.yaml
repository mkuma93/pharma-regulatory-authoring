# Cloud Build — CTD Structure API (FastAPI backend)
#
# Build context: repo root
# Dockerfile:    ctd_structure/api/Dockerfile

substitutions:
  _PROJECT_ID:   your-gcp-project-id
  _REGION:       us-central1
  _SERVICE_NAME: ctd-api
  _AR_REPO:      ich4
  _TAG:          latest
  _ICH_INDEX_URL: "https://ich4-index-PROJECT_NUMBER.us-central1.run.app"
  _GCS_BUCKET:   your-gcs-bucket-name

steps:
  # 1. Unit tests
  - name: "python:3.12-slim"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install --quiet pytest -r ctd_structure/api/requirements.txt \
        && python -m pytest tests/test_ctd_structure/ -v

  # 3. Ensure Artifact Registry repo exists
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe $_AR_REPO \
          --location=$_REGION --project=$_PROJECT_ID &>/dev/null \
        || gcloud artifacts repositories create $_AR_REPO \
          --repository-format=docker \
          --location=$_REGION \
          --project=$_PROJECT_ID \
          --description="ICH4 Docker images"

  # 4. Docker auth
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - "gcloud auth configure-docker $_REGION-docker.pkg.dev --quiet"

  # 5. Build
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - ctd_structure/api/Dockerfile
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest"
      - .

  # 6. Push
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME"

  # 7. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--ingress=all"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--port=8081"
      - "--timeout=900"
      - "--cpu-boost"
      - "--set-env-vars=GCP_PROJECT_ID=$_PROJECT_ID,ICH_INDEX_URL=$_ICH_INDEX_URL,GCS_BUCKET=$_GCS_BUCKET,PUBSUB_TOPIC=ctd-extraction,CONTENT_PUBSUB_TOPIC=ich4-content-generation"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest"

images:
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY

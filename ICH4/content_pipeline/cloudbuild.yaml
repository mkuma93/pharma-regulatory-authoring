substitutions:
  _PROJECT_ID: pharma-reguatory-author
  _REGION: us-central1
  _SERVICE_NAME: ich4-content-pipeline
  _AR_REPO: ich4
  _TAG: latest
  # Service URLs injected as env vars at deploy time
  _INDEX_SERVICE_URL: https://ich4-index-74ugcbbbya-uc.a.run.app
  _TEMPLATE_SERVICE_URL: https://ich4-template-74ugcbbbya-uc.a.run.app
  _CLINICAL_ANALYST_SERVICE_URL: "https://clinical-analyst-74ugcbbbya-uc.a.run.app"

steps:
  # 0. Run unit tests — deployment is blocked if any test fails
  - name: "python:3.11-slim"
    id: test-ich4-content-pipeline
    dir: ICH4/content_pipeline
    entrypoint: bash
    args:
      - "-ec"
      - |
        pip install --upgrade pip && \
        pip install -r requirements.txt pytest httpx && \
        python -m pytest tests/ -v --tb=short

  # 1. Create Artifact Registry repo (idempotent)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe $_AR_REPO \
          --location=$_REGION --project=$_PROJECT_ID &>/dev/null \
        || gcloud artifacts repositories create $_AR_REPO \
          --repository-format=docker \
          --location=$_REGION \
          --project=$_PROJECT_ID

  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - -f
      - ICH4/content_pipeline/Dockerfile
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - "--region=$_REGION"
      - "--project=$_PROJECT_ID"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--ingress=all"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--timeout=360"
      - "--set-env-vars=GCP_PROJECT_ID=$_PROJECT_ID,INDEX_SERVICE_URL=$_INDEX_SERVICE_URL,TEMPLATE_SERVICE_URL=$_TEMPLATE_SERVICE_URL,CLINICAL_ANALYST_SERVICE_URL=$_CLINICAL_ANALYST_SERVICE_URL"

images:
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"

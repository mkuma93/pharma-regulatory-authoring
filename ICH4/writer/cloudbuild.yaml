substitutions:
  _PROJECT_ID: pharma-reguatory-author
  _REGION: us-central1
  _SERVICE_NAME: ich4-writer
  _AR_REPO: ich4
  _TAG: latest
  _GCS_BUCKET_NAME: ""

steps:
  # 0. Run unit tests — deployment is blocked if any test fails
  - name: "python:3.11-slim"
    id: test-ich4-writer
    dir: ICH4/writer
    entrypoint: bash
    args:
      - "-ec"
      - |
        pip install --upgrade pip && \
        pip install -r requirements.txt pytest httpx && \
        OPENAI_API_KEY=test-key GCP_PROJECT_ID="" python -m pytest tests/ -v --tb=short

  # 1. Create Artifact Registry repo (idempotent)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe $_AR_REPO \
          --location=$_REGION --project=$_PROJECT_ID &>/dev/null \
        || gcloud artifacts repositories create $_AR_REPO \
          --repository-format=docker \
          --location=$_REGION \
          --project=$_PROJECT_ID

  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - -f
      - ICH4/writer/Dockerfile
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
      - "--region=$_REGION"
      - "--project=$_PROJECT_ID"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--ingress=all"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--concurrency=5"
      - "--timeout=600"
      - "--service-account=$_SERVICE_NAME@$_PROJECT_ID.iam.gserviceaccount.com"
      - "--set-env-vars=GCP_PROJECT_ID=$_PROJECT_ID,GCS_BUCKET_NAME=$_GCS_BUCKET_NAME"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest"

images:
  - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$_TAG"
